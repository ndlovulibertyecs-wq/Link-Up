{% extends "base.html" %}

{% block title %}Sign Up - Link-Up{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 text-center">Create Account</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.signup') }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name"
                               placeholder="Your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email"
                               placeholder="email@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password"
                               placeholder="At least 6 characters" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label class="form-label">I want to join as:</label>
                        <div class="d-flex gap-2">
                            <div class="form-check flex-fill">
                                <input class="form-check-input" type="radio" name="role"
                                       id="seeker" value="seeker" checked>
                                <label class="form-check-label w-100 text-center p-2 border rounded" for="seeker">
                                    <div>🔍</div>
                                    <div><strong>Seeker</strong></div>
                                    <small class="text-muted">Find things</small>
                                </label>
                            </div>
                            <div class="form-check flex-fill">
                                <input class="form-check-input" type="radio" name="role"
                                       id="provider" value="provider">
                                <label class="form-check-label w-100 text-center p-2 border rounded" for="provider">
                                    <div>🛠️</div>
                                    <div><strong>Provider</strong></div>
                                    <small class="text-muted">Offer things</small>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Create Account
                        </button>
                        <a href="{{ url_for('auth.signin') }}" class="btn btn-outline-primary">
                            Already have an account? Sign In
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
